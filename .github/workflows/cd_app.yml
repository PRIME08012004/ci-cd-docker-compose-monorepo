name: Continuous Deployment (Prod) (Backend)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.http-server
          push: true
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          tags: |
            optimusprime0801/ci-cd-backend:${{ github.sha }}
            optimusprime0801/ci-cd-backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 52.90.222.209
          username: ubuntu
          key: ${{ secrets.SSH_KEY_PK }}
          port: 22
          script: |
             set -e

             echo "Pulling new Docker image..."
                 /usr/bin/docker pull optimusprime0801/ci-cd-backend:${{ github.sha }}

             echo "Stopping old container..."
             /usr/bin/docker stop backend || true
             /usr/bin/docker rm backend || true

              echo "Starting new container..."
             /usr/bin/docker run -d \
              --name backend \
             --restart unless-stopped \
             -p 8080:8080 \
             optimusprime0801/ci-cd-backend:${{ github.sha }}

             echo "Running containers..."
                /usr/bin/docker ps

                echo "Deployment complete!"