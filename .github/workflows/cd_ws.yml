name: Continuous Deployment (Prod) (ws)
on:
  push:
    branches: [ main ]
jobs:
  build:
    
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      
      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify user  secret
        run: echo "${{ secrets.DOCKERHUB_USERNAME }}"
      - name: Verify token secret
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}"  

      - name: Build and push
        uses: docker/build-push-action@v4
        
        with:
          context: .
          file: ./Dockerfile.ws
          push: true
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
         
          tags: optimusprime0801/ci-cd-ws:${{ github.sha }}

     
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 52.90.222.209
          username: ubuntu
          key: ${{ secrets.SSH_KEY_PK }}
          port: 22

          script: |
             set -e

             echo "Pulling new Docker image..."
                 /usr/bin/docker pull optimusprime0801/ci-cd-ws:${{ github.sha }}

             echo "Stopping old container..."
             /usr/bin/docker stop ws || true
             /usr/bin/docker rm ws || true

              echo "Starting new container..."
             /usr/bin/docker run -d \
              --name ws \
             --restart unless-stopped \
             -p 8081:8081 \
             optimusprime0801/ci-cd-ws:${{ github.sha }}

             echo "Running containers..."
                /usr/bin/docker ps

                echo "Deployment complete!"